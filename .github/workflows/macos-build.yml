name: macOS Build & Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'packaging/build_windows.ps1'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'packaging/build_windows.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build & Test macOS (${{ matrix.display_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            display_name: "Apple Silicon ARM64"
            artifact_name: "KeyboardShotgun-macOS-AppleSilicon-arm64"
          - os: macos-15-intel
            arch: x86_64
            display_name: "Intel x86_64"
            artifact_name: "KeyboardShotgun-macOS-Intel-x86_64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          echo "=========================================="
          echo "Runner OS:           $(uname -s)"
          echo "Runner Release:      $(uname -r)"
          echo "Runner Hardware Arch: $(uname -m)"
          echo "Expected Target Arch: ${{ matrix.arch }}"
          echo "=========================================="

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Create virtual environment and install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify audio asset (shotgun.wav)
        run: |
          if [ ! -f "shotgun.wav" ]; then
            echo "::error::shotgun.wav audio asset not found in project root directory!"
            exit 1
          fi
          echo "shotgun.wav verified: $(ls -lh shotgun.wav)"

      - name: Test Python application module imports
        run: |
          source .venv/bin/activate
          python3 -c "
          import main
          import core
          import core.assets
          import core.config_manager
          import core.event_handler
          import core.interfaces
          import core.keyboard_listener
          import core.sound_engine
          import ui
          import ui.main_window
          import ui.styles
          import ui.tray_manager
          import platforms
          import platforms.macos
          print('All Keyboard Shotgun modules imported cleanly on macOS!')
          "

      - name: Run automated test suite
        env:
          SDL_VIDEODRIVER: "dummy"
          SDL_AUDIODRIVER: "dummy"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          source .venv/bin/activate
          pytest -v

      - name: Test headless application initialization
        env:
          SDL_VIDEODRIVER: "dummy"
          SDL_AUDIODRIVER: "dummy"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          source .venv/bin/activate
          python3 -c "
          from core.assets import get_asset_path
          from core.config_manager import ConfigManager
          from core.sound_engine import SoundEngine
          from core.event_handler import EventHandler
          from platforms.macos import is_macos, get_architecture, check_permissions

          print(f'is_macos(): {is_macos()}')
          print(f'Detected architecture: {get_architecture()}')

          # Inspect macOS permissions in headless CI environment
          has_perm, perm_msg = check_permissions()
          print(f'Accessibility permission status in CI environment: {has_perm}')
          print(f'Note: In headless CI, AXIsProcessTrusted is expected to be False because interactive user consent is not possible.')

          # Test configuration loading & defaults
          cfg = ConfigManager()
          assert cfg.get('master_volume') == 0.8
          print('ConfigManager initialized and verified.')

          # Test audio engine loading and pitch variation generation with shotgun.wav
          wav_path = get_asset_path('shotgun.wav')
          assert wav_path.exists(), f'Audio file {wav_path} does not exist!'
          engine = SoundEngine(audio_path=wav_path)
          engine.load_audio()
          assert engine.is_ready()
          assert len(engine._variations) == 10
          print('SoundEngine successfully pre-generated 10 pitch variations.')

          # Test event handler pipeline and queuing
          handler = EventHandler(sound_engine=engine, config_manager=cfg)
          handler.start()
          handler.submit_event()
          handler.stop()
          engine.cleanup()
          print('Headless application initialization test passed successfully.')
          "

      - name: Build macOS .app bundle using PyInstaller
        run: |
          source .venv/bin/activate
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Verify built macOS application bundle and audio asset
        run: |
          if [ ! -d "dist/KeyboardShotgun.app" ]; then
            echo "::error::dist/KeyboardShotgun.app was not created!"
            exit 1
          fi
          echo "Successfully verified dist/KeyboardShotgun.app bundle."

          # Verify Mach-O binary
          EXE_PATH="dist/KeyboardShotgun.app/Contents/MacOS/KeyboardShotgun"
          if [ ! -f "$EXE_PATH" ]; then
            echo "::error::Executable not found at $EXE_PATH!"
            exit 1
          fi
          file "$EXE_PATH"

          # Verify bundled shotgun.wav
          AUDIO_PATH=$(find dist/KeyboardShotgun.app -name "shotgun.wav" | head -n 1)
          if [ -z "$AUDIO_PATH" ]; then
            echo "::error::shotgun.wav is missing from dist/KeyboardShotgun.app bundle!"
            exit 1
          fi
          echo "Bundled audio asset verified: $AUDIO_PATH ($(ls -lh "$AUDIO_PATH"))"

          # Verify bundled config.json
          CONFIG_PATH=$(find dist/KeyboardShotgun.app -name "config.json" | head -n 1)
          if [ -n "$CONFIG_PATH" ]; then
            echo "Bundled config asset verified: $CONFIG_PATH ($(ls -lh "$CONFIG_PATH"))"
          fi

      - name: Create ZIP archive of .app bundle
        run: |
          cd dist
          zip -r -y "${{ matrix.artifact_name }}.zip" "KeyboardShotgun.app"
          echo "Created archive: dist/${{ matrix.artifact_name }}.zip"

      - name: Upload macOS application bundle (.app)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/KeyboardShotgun.app
            dist/${{ matrix.artifact_name }}.zip
          retention-days: 14
          if-no-files-found: error

